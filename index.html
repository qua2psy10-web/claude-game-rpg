<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>エルドラシア戦記 — The Chronicles of Eldrasia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <div id="gameControls">
      <button id="endGameBtn" onclick="endGameAndSave()">セーブして終了</button>
    </div>
  </div>
  <div id="touchControls">
    <div id="dpad" data-dir=""><span class="ar up">▲</span><span class="ar dn">▼</span><span class="ar lf">◀</span><span class="ar rt">▶</span></div>
    <div id="abtns"><button id="btnB" type="button">B<small>もどる</small></button><button id="btnA" type="button">A<small>けってい</small></button></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/music.js"></script>
  <script src="js/map.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/opening.js"></script>
  <script src="js/town.js"></script>
  <script src="js/ambience.js"></script>
  <script src="js/bestiary.js"></script>
  <script src="js/hints.js"></script>
  <script src="js/records.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/smith.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
